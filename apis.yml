aid: pensive
name: Pensive
description: Pensive is an AI grading platform for educators at schools and universities. Its
  "AI Grader" helps instructors evaluate student work — grading assignments and returning feedback
  at scale — alongside an AI tutor product for students. Pensive serves distinct teacher, student,
  and administrator surfaces, publishes case studies with university instructors, and maintains a
  SOC 2 trust center. It is a seed-stage company backed by Mayfield. As of this profiling Pensive
  operates a private, authenticated web product and publishes no public API, developer portal, or
  documentation surface.
